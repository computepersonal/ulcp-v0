services:
  postgres:
    image: postgres:16-alpine
    container_name: ulcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulcp_user
      POSTGRES_PASSWORD: ulcp_pass
      POSTGRES_DB: ulcp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulcp_user -d ulcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ulcp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: ulcp-identity
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://ulcp_user:ulcp_pass@postgres:5432/ulcp?schema=identity
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_must_be_32_chars_long!!
      JWT_REFRESH_SECRET: dev_refresh_secret_32_chars_long!!
      JWT_CUSTOMER_SECRET: dev_customer_secret_32_chars_!!
      JWT_KDS_SECRET: dev_kds_secret_must_be_32chars!!
      INTERNAL_API_SECRET: dev_internal_secret_ulcp_services
      ALLOWED_ORIGIN: http://localhost:5173
    command: sh -c "node node_modules/.bin/prisma db push --skip-generate && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    container_name: ulcp-tenant
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://ulcp_user:ulcp_pass@postgres:5432/ulcp?schema=tenant
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_must_be_32_chars_long!!
      JWT_REFRESH_SECRET: dev_refresh_secret_32_chars_long!!
      JWT_CUSTOMER_SECRET: dev_customer_secret_32_chars_!!
      JWT_KDS_SECRET: dev_kds_secret_must_be_32chars!!
      INTERNAL_API_SECRET: dev_internal_secret_ulcp_services
      IDENTITY_SERVICE_URL: http://ulcp-identity:3001
    command: sh -c "node node_modules/.bin/prisma db push --skip-generate && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started

  catalogue-service:
    build:
      context: .
      dockerfile: services/catalogue-service/Dockerfile
    container_name: ulcp-catalogue
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://ulcp_user:ulcp_pass@postgres:5432/ulcp?schema=catalogue
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_must_be_32_chars_long!!
      JWT_CUSTOMER_SECRET: dev_customer_secret_32_chars_!!
      INTERNAL_API_SECRET: dev_internal_secret_ulcp_services
      TENANT_SERVICE_URL: http://ulcp-tenant:3002
    command: sh -c "node node_modules/.bin/prisma db push --skip-generate && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: ulcp-order
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://ulcp_user:ulcp_pass@postgres:5432/ulcp?schema=order_svc
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_must_be_32_chars_long!!
      JWT_CUSTOMER_SECRET: dev_customer_secret_32_chars_!!
      JWT_KDS_SECRET: dev_kds_secret_must_be_32chars!!
      INTERNAL_API_SECRET: dev_internal_secret_ulcp_services
      CATALOGUE_SERVICE_URL: http://ulcp-catalogue:3003
      TENANT_SERVICE_URL: http://ulcp-tenant:3002
      COMMISSION_FREE: 3
      COMMISSION_STARTER: 2
      COMMISSION_PRO: 1.5
    command: sh -c "node node_modules/.bin/prisma db push --skip-generate && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime-service:
    build:
      context: .
      dockerfile: services/realtime-service/Dockerfile
    container_name: ulcp-realtime
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_must_be_32_chars_long!!
      JWT_CUSTOMER_SECRET: dev_customer_secret_32_chars_!!
      JWT_KDS_SECRET: dev_kds_secret_must_be_32chars!!
      INTERNAL_API_SECRET: dev_internal_secret_ulcp_services
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

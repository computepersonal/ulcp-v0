name: workstation-observability  # keep: the Loki/Grafana volumes and the Windows collector depend on this name
services:
  docker-collector:
    image: grafana/alloy:v1.19.2
    command: ["run", "--stability.level=public-preview", "--disable-reporting", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/docker.alloy"]
    restart: unless-stopped
    volumes:
      - ./docker.alloy:/etc/alloy/docker.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-collector-data:/var/lib/alloy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/local.yml"]
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./loki.yml:/etc/loki/local.yml:ro
      - loki-data:/loki
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/workstation.json
    secrets: [grafana_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
secrets:
  grafana_password:
    file: ./secrets/grafana-password.txt
volumes:
  docker-collector-data:
  loki-data:
  prometheus-data:
  grafana-data:
